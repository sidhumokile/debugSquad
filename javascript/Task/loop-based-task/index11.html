<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task-11</title>
</head>
<body>
    <!-- 11. Add to Cart Simulation
Prompt the user repeatedly (via prompt) to enter items until 5 items are added. Show the list
after completion. -->
<h2>Add to Cart</h2>
<div id="cartlist"></div>

<script>
    let cart=[];
    let i=0;

    while(i<5){
        let item=prompt("eneter item"+(i+1)+"to cart :");
        if (item && item.trim() !==""){
            cart.push(item);
            i++;
        }
    }
    let list=document.getElementById("cartlist");
    for(let j=0;j<cart.length;j++){
        list.innerHTML+=`<li>${cart[j]}</li>`
    }
</script>

    
</body>
</html>
