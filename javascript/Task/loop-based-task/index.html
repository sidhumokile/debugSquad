<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loop based tsaks </title>
</head>
<body>

 <!-- 1. Product List as Bullet Points
Create a ul using innerHTML. Loop through an array of 5 product names and display them as
bullet points.
let products = ["Laptop", "Mobile", "Camera", "Shoes", "Earphones"]; -->

    <h2>product list</h2>
    <ul id="product"></ul>

    <script>
          let products = ["Laptop", "Mobile", "Camera", "Shoes", "Earphones"];

    let product = document.getElementById("product");
    let listItems = "";

    for (let i = 0; i < products.length; i++) {
      listItems += "<li>" + products[i] + "</li>";
    }

    product.innerHTML = listItems;

    </script>
</body>
</html>
