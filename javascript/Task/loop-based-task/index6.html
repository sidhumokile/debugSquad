<!-- 
    6. Countdown Display
Use a while loop to count down from 10 to 1 and display in a <div>. -->

    
    <h2>countdown</h2>
    <div id="count"></div>
    <script>
        let num=15;
        let out=document.getElementById("count");

        while(num>=1){
            out.innerHTML+=num+"<br>";
            num--;
        }
    </script>
    
</body>
