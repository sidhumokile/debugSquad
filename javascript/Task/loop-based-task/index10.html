<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>task-10</title>
</head>
<body>
    <!-- 10. Show First 3 Products from Array
Only display the first 3 products in a ul, even if array has more than 3 items. -->

<h2>product list</h2>
    <ul id="product"></ul>

    <script>
          let products = ["Laptop", "Mobile", "Camera", "Shoes", "Earphones"];

    let product = document.getElementById("product");
    let listItems = "";

    for (let i = 0; i < 3; i++) {
      listItems += "<li>" + products[i] + "</li>";
    }

    product.innerHTML = listItems;

    </script>
    
</body>
</html>
