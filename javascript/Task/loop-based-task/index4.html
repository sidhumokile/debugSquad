<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 4. Build Order Summary Table
Using an array of objects (name, quantity, price), create a table with:
S.No | Product | Quantity | Price | Total -->
<h2>Order summary</h2>
<table id="order" border="1" cellpadding="10" cellspacing="0">
    <tr>
        <th>S.NO</th>
        <th>Product</th>
        <th>Quantity</th>
        <th>Price</th>
        <th>total</th>
    </tr>
</table>
<script>
    let items=[
    {name:"biryani",quantity:2,price:250},
    {name:"starters",quantity:3,price:150},
    {name:"desert",quantity:2,price:100}
    ];
    let table=document.getElementById("order");
    for(let i=0;i<items.length;i++){
        let total=items[i].quantity*items[i].price;
        table.innerHTML +=`
        <tr>
            <td>${i+1}</td>
            <td>${items[i].name}</td>
            <td>${items[i].quantity}</td>
            <td>${items[i].price}</td>
            <td>${total}</td>
        </tr>
        `
    }
</script>


</body>
</html>
