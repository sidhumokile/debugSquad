<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, Helvetica, sans-serif;
}
header {
  width: 100%;
  padding: 15px 30px;
  background: #111;
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header .logo img {
  width: 60px;
  height: 60px;
  border-radius: 50%;
}

header nav a {
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  margin-left: 10px;
  font-size: 18px;
  transition: 0.3s;
}

header nav a:hover {
  background: white;
  color: black;
  border-radius: 5px;
}

#flash {
  text-align: center;
  padding: 20px;
  background: #ffecec;
  border-bottom: 2px solid #f44;
}

#flash h1 {
  color: #d60000;
  text-transform: uppercase;
}

#flash p {
  color: #333;
}

#flash h3 {
  margin-top: 10px;
  font-size: 22px;
}


#card {
  display: flex;
  flex-wrap: wrap;
  gap: 25px;
  justify-content: center;
  padding: 30px 10px;
}

.cards {
  width: 250px;
  background: white;
  border-radius: 10px;
  padding: 15px;
  box-shadow: 0px 2px 8px rgba(0,0,0,0.2);
  transition: transform 0.3s, box-shadow 0.3s;
  text-align: center;
}

.cards:hover {
  transform: scale(1.06);
  box-shadow: 0px 4px 12px rgba(0,0,0,0.3);
}

.cards img {
  width: 100%;
  height: 200px;
  border-radius: 8px;
  object-fit: cover;
}

.cards h4 {
  margin-top: 10px;
  font-size: 20px;
}

.cards p {
  margin: 5px 0;
  color: #444;
}


.cards button {
  margin-top: 10px;
  width: 100%;
  padding: 10px;
  border: none;
  background: #111;
  color: white;
  border-radius: 5px;
  cursor: pointer;
  font-size: 16px;
}

.cards button:hover {
  background: #333;
}


/* ---------- CART SECTION ---------- */
h2 {
  text-align: center;
  margin-top: 20px;
}

#cartitems {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px;
}

#table {
  width: 70%;
  border-collapse: collapse;
  margin-top: 15px;
  font-size: 18px;
}

#table th {
  color: white;
  padding: 10px;
}

#table td {
  padding: 10px;
  border: 1px solid #aaa;
}

#total {
  margin-top: 20px;
  font-size: 24px;
  font-weight: bold;
}


    </style>
    <title>applicaton </title>
</head>
<body>
    <header>
        <div class="logo">
            <img src="/assets/images/logotask.avif" alt="logo"></div>
            <nav>
        <a href="#">home</a>
          <a href="#">about</a>
            <a href="#">contact</a>
              <a href="#">help</a>
    </nav>
    </header>

    <nav id="flash">
        <h1>flash Sale</h1>
        <p>limited offer</p>
        <h3 id="timer" style="color: aquamarine;"></h3>
    </nav>

    <section id="card"></section>

    <hr>

    <h2>CART ITEMS</h2>
    <section id="cartitems">
        <table id="table">
            <tr>
                <th>Name of items</th>
                <th>price</th>
            </tr>
        </table>
        <h3 id="total"></h3>
    </section>
    <script>
        let items = [
    { id:1, name:"IQOO",      price:15000, img:"https://m.media-amazon.com/images/I/61Vb6GsQgrL._AC_UY327_FMwebp_QL65_.jpg", stock:"available",   rating:4.0 },
    { id:2, name:"Samsung",   price:20000, img:"https://m.media-amazon.com/images/I/71kmZ1zJYUL._AC_UY327_FMwebp_QL65_.jpg",        stock:"unavailable", rating:4.5 },
    { id:3, name:"POCO",      price:18000, img:"https://m.media-amazon.com/images/I/71EfJ+H1uRL._AC_UY327_FMwebp_QL65_.jpg",        stock:"available",   rating:4.0 },
    { id:4, name:"realme",    price:25000, img:"https://m.media-amazon.com/images/I/71Vjn1DfArL._AC_UY327_FMwebp_QL65_.jpg",        stock:"available",   rating:4.2 },
    { id:5, name:"OnePlus",   price:30000, img:"https://m.media-amazon.com/images/I/61IOa9IrlaL._AC_UY327_FMwebp_QL65_.jpg",        stock:"available",   rating:4.8 },
    { id:6, name:"iPhone 17", price:120000,img:"https://m.media-amazon.com/images/I/31Bn8sQI3xL._SX342_SY445_QL70_FMwebp_.jpg",   stock:"unavailable", rating:5.0 }
  ];

  const cardContainer = document.getElementById('card');
  cardContainer.innerHTML = ''; 

  items.forEach(item => {
    
    const disabledAttr = item.stock !== 'available' ? 'disabled' : '';
    const buttonText = item.stock !== 'available' ? 'Out of stock' : 'Add to cart';

    cardContainer.innerHTML += `
      <div class="cards">
        <img src="${item.img}" alt="${item.name}">
        <h4>${item.name}</h4>
        <p>Rs. ${item.price}</p>
        <p>Stock: ${item.stock}</p>
        <button ${disabledAttr} onclick="addToCart(${item.id})">${buttonText}</button>
      </div>
    `;
  });

  let cartItems = [];     
  let total = 0;

  function addToCart(id) {
   


    const product = items.find(p => p.id === id);
    if (!product) {
      alert('Product not found');
      return;
    }

    if (product.stock !== 'available') {
      alert('This product is currently unavailable.');
      return;
    }

    if (cartItems.some(p => p.id === id)) {
      alert('This product is already in the cart!');
      return;
    }

   
    cartItems.push(product);
    total += product.price;

  
    appendCartRow(product);
    updateTotal();
  }
  function appendCartRow(product) {
    const table = document.getElementById('table');
   
    table.insertAdjacentHTML('beforeend', `
      <tr>
        <td>${product.name}</td>
        <td>${product.price}</td>
      </tr>
    `);
  }


  function updateTotal() {
    document.getElementById('total').innerText = 'Total: Rs. ' + total;
  }

  
    
  
    </script>
</body>
</html>
