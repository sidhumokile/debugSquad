<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>applicaton </title>
    <script src="https://cdn.tailwindcss.com"></script>

</head>
<body>
    <header class="w-full p-4 bg-black text-white flex justify-between items-center">
        <div class="logo">
            <img src="/assets/images/logotask.avif" alt="logo" class="w-14 h-14 rounded-full"></div>
            <nav class="space-x-4">
          <a href="#" class="text-lg hover:bg-white hover:text-black px-3 py-1 rounded transition">home</a>
                 <a href="#" class="text-lg hover:bg-white hover:text-black px-3 py-1 rounded transition">about</a>
            <a href="#" class="text-lg hover:bg-white hover:text-black px-3 py-1 rounded transition">contact</a>
              <a href="#" class="text-lg hover:bg-white hover:text-black px-3 py-1 rounded transition">help</a>
                <a href="./login.html" class="text-lg hover:bg-white hover:text-black px-3 py-1 rounded transition">logout</a>
              </div>
       
    </nav>
    </header>

    <nav id="flash" class="text-center p-6 bg-red-100 border-red-500">
        <h1 class="text-blue-800 text-4xl fond-bold uppercase">flash Sale</h1>
        <p text-gray-800>limited offer</p>
        <h3 id="timer" style="color: rgb(255, 127, 236);"></h3>
    </nav>

    <section id="card" class="flex flex-wrap gap-6 justify-center p-6"></section>

    <hr class="my-4">

    <h2 class="text-center text-3xl font-bold">CART ITEMS</h2>
    <section id="cartitems" class="flex flex-col items-center p-6">
        <table id="table" class="w-3/4 border-collapse mt-4 text-lg">
            <tr class="bg-black text-white">
                <th class="p-3">Name of items</th>
                <th class="p-3">price</th>
            </tr>
        </table>
        <h3 id="total" class="text-2xl font-bold mt-4"></h3>
    </section>
    <script>
        let items = [
    { id:1, name:"IQOO",      price:15000, img:"https://m.media-amazon.com/images/I/61Vb6GsQgrL._AC_UY327_FMwebp_QL65_.jpg", stock:"available",   rating:4.0 },
    { id:2, name:"Samsung",   price:20000, img:"https://m.media-amazon.com/images/I/71kmZ1zJYUL._AC_UY327_FMwebp_QL65_.jpg",        stock:"unavailable", rating:4.5 },
    { id:3, name:"POCO",      price:18000, img:"https://m.media-amazon.com/images/I/71EfJ+H1uRL._AC_UY327_FMwebp_QL65_.jpg",        stock:"available",   rating:4.0 },
    { id:4, name:"realme",    price:25000, img:"https://m.media-amazon.com/images/I/71Vjn1DfArL._AC_UY327_FMwebp_QL65_.jpg",        stock:"available",   rating:4.2 },
    { id:5, name:"OnePlus",   price:30000, img:"https://m.media-amazon.com/images/I/61IOa9IrlaL._AC_UY327_FMwebp_QL65_.jpg",        stock:"available",   rating:4.8 },
    { id:6, name:"iPhone 17", price:120000,img:"https://m.media-amazon.com/images/I/31Bn8sQI3xL._SX342_SY445_QL70_FMwebp_.jpg",   stock:"unavailable", rating:5.0 }
  ];

  const cardContainer = document.getElementById('card');
  cardContainer.innerHTML = ''; 

  items.forEach(item => {
    
    const disabledAttr = item.stock !== 'available' ? 'disabled' : '';
    const buttonText = item.stock !== 'available' ? 'Out of stock' : 'Add to cart';

    cardContainer.innerHTML += `
      <div class="cards">
        <img src="${item.img}" alt="${item.name}">
        <h4>${item.name}</h4>
        <p>Rs. ${item.price}</p>
        <p>Stock: ${item.stock}</p>
        <button ${disabledAttr} onclick="addToCart(${item.id})">${buttonText}</button>
      </div>
    `;
  });

  let cartItems = [];     
  let total = 0;

  function addToCart(id) {
   


    const product = items.find(p => p.id === id);
    if (!product) {
      alert('Product not found');
      return;
    }

    if (product.stock !== 'available') {
      alert('This product is currently unavailable.');
      return;
    }

    if (cartItems.some(p => p.id === id)) {
      alert('This product is already in the cart!');
      return;
    }

   
    cartItems.push(product);
    total += product.price;

  
    appendCartRow(product);
    updateTotal();
  }
  function appendCartRow(product) {
    const table = document.getElementById('table');
   
    table.insertAdjacentHTML('beforeend', `
      <tr>
        <td>${product.name}</td>
        <td>${product.price}</td>
      </tr>
    `);
  }


  function updateTotal() {
    document.getElementById('total').innerText = 'Total: Rs. ' + total;
  }

  

   // timer//

   let time = 7 * 24 * 60 * 60;  

const timerElement = document.getElementById("timer");

let countdown = setInterval(() => {

    let days = Math.floor(time / (24 * 60 * 60));
    let hours = Math.floor((time % (24 * 60 * 60)) / 3600);
    let minutes = Math.floor((time % 3600) / 60);
    let seconds = time % 60;

  
    if (hours < 10) hours = "0" + hours;
    if (minutes < 10) minutes = "0" + minutes;
    if (seconds < 10) seconds = "0" + seconds;

    timerElement.innerHTML = `${days}d : ${hours}h : ${minutes}m : ${seconds}s`;

    time--;

    if (time < 0) {
        clearInterval(countdown);
        timerElement.innerHTML = "Offer Expired";
        timerElement.style.color = "red";
    }

}, 1000);
    
  
    </script>
</body>
</html>
