<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>javascript</title>
</head>

<body>
    <!-- inline js -->
    <!-- JavaScript code written inside an HTML tag using an event attribute (like onclick, onmouseover, etc.) -->
    <!-- <button onclick="alert('Hello! This is Inline JS')">Click Me</button> -->

    <!-- 2️ Internal JavaScript

JavaScript code written inside the same HTML file, but in a <script> tag, usually at the bottom of <body> or inside <head>. -->

    <!-- example<script>alert("welcome to js ") </script> -->


    <!-- 3️ External JavaScript

 Definition:
JavaScript code is written in a separate file with a .js extension.
Then it is linked to your HTML file using the <script src="file.js"></script> tag. -->
<script src="script.js"></script>
</body>

</html>
